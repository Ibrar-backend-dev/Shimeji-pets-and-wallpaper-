[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
testpaths = tests
addopts =
    --strict-markers
    --tb=short
    -ra
filterwarnings =
    error::DeprecationWarning:apps.*
    ignore::DeprecationWarning
markers =
    slow: takes noticeably longer than the rest of the suite
